<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Лист — локальный текстовый редактор</title>
  <style>
    :root {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
      --canvas:#eeefec; --surface:#fff; --surface-2:#fafbf9; --ink:#222c26;
      --muted:#828b83; --line:#e6eae5; --hover:#f2f5f0; --selected:#e7f0e8;
      --accent:#315d43; --accent-contrast:#fff; --warning:#a76c25; --error:#ad413b;
      --scroll:#bbc7bc; --shadow:0 20px 65px rgba(26,45,29,.06);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas:#101511; --surface:#1a211c; --surface-2:#1c251f; --ink:#e5ede5;
      --muted:#97a59a; --line:#303e33; --hover:#27352b; --selected:#2c4835;
      --accent:#9acda9; --accent-contrast:#142219; --warning:#edbc78; --error:#f4a5a0;
      --scroll:#526658; --shadow:0 20px 65px rgba(0,0,0,.15);
    }
    * {box-sizing:border-box; scrollbar-color:var(--scroll) transparent; scrollbar-width:thin;}
    *::-webkit-scrollbar {width:9px; height:9px;}
    *::-webkit-scrollbar-thumb {background:var(--scroll); border:2px solid var(--surface); border-radius:999px;}
    *::-webkit-scrollbar-track {background:transparent;}
    html,body {margin:0; width:100%; height:100%; min-width:0;}
    body {background:var(--surface); color:var(--ink);}
    button,input,select,textarea {font:inherit;}
    button {cursor:pointer;}
    button:disabled {opacity:.38; cursor:not-allowed;}
    :is(button,input,select,textarea):focus-visible {outline:2px solid var(--accent); outline-offset:2px;}
    .shell {--sidebar-width:315px; --footer-height:56px; display:flex; width:100%; height:100dvh; min-height:0;
      margin:0; overflow:hidden; background:var(--surface); border:0; border-radius:0; box-shadow:none; position:relative;}
    .sidebar {width:var(--sidebar-width); flex:0 0 var(--sidebar-width); min-width:0; height:100%; display:flex; flex-direction:column; background:var(--surface-2); transition:width .22s ease,flex-basis .22s ease;}
    .sidebar-resizer {flex:0 0 6px; width:6px; min-width:6px; position:relative; cursor:col-resize; touch-action:none; z-index:11;}
    .sidebar-resizer::before {content:''; position:absolute; inset:0 auto 0 2px; width:1px; background:var(--line); transition:width .15s ease, background .15s ease;}
    .sidebar-resizer:hover::before,.sidebar-resizer:focus-visible::before,.shell.sidebar-resizing .sidebar-resizer::before {width:3px; background:var(--accent);}
    .sidebar-resizer:focus-visible {outline:2px solid var(--accent); outline-offset:-2px;}
    .shell.sidebar-hidden .sidebar-resizer {display:none;}
    .shell.sidebar-resizing .sidebar {transition:none;}
    :root.dragging-sidebar,:root.dragging-sidebar * {cursor:col-resize!important; user-select:none!important;}
    .shell.sidebar-hidden .sidebar {width:0; flex-basis:0; overflow:hidden; border:0;}
    .aside-head {height:68px; flex:0 0 68px; display:flex; align-items:center; gap:7px; padding:0 16px 0 22px; border-bottom:1px solid var(--line); position:relative; z-index:12;}
    .workspace-trigger {border:0; background:transparent; color:var(--ink); display:flex; gap:8px; align-items:center; min-width:0; max-width:100%; padding:9px 0; flex:1; text-align:left; font-weight:650; font-size:13px;}
    .workspace-trigger .workspace-label {overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .workspace-trigger svg {width:15px; height:15px; flex:0 0 auto; color:var(--muted);}
    .icon-btn {border:0; border-radius:9px; background:transparent; color:var(--muted); width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center;}
    .icon-btn:hover:not(:disabled) {background:var(--hover); color:var(--ink);}
    .icon-btn svg {width:18px; height:18px; stroke-width:1.8;}
    .tree {flex:1; min-height:0; overflow:auto; padding:16px 10px 20px;}
    .empty-workspace {margin:65px 14px; padding:24px 8px; text-align:center; color:var(--muted); font-size:12px; line-height:1.65;}
    .empty-workspace svg {display:block; width:38px; height:38px; margin:0 auto 18px; stroke-width:1.3; color:var(--accent);}
    .empty-workspace strong {display:block; color:var(--ink); font-size:13px; font-weight:600; margin-bottom:8px;}
    .text-button {display:inline-flex; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:9px 12px; margin-top:15px; font-size:12px; font-weight:550;}
    .text-button:hover {background:var(--hover);}
    .tree-row {min-width:0; display:flex; align-items:center; gap:1px; border-radius:8px;}
    .tree-row:hover {background:var(--hover);}
    .tree-row.selected {background:var(--selected);}
    .tree-row.active .entry-label {font-weight:650; color:var(--accent);}
    .tree-entry {display:flex; align-items:center; min-width:0; flex:1; gap:7px; background:transparent; border:0; color:var(--ink); text-align:left; padding:8px 0 8px 7px; border-radius:8px; font-size:12.5px;}
    .tree-entry svg {width:15px; height:15px; flex:0 0 15px; color:var(--muted);}
    .tree-entry .twisty {width:12px; height:12px; flex-basis:12px; transition:transform .15s;}
    .tree-entry[aria-expanded="true"] .twisty {transform:rotate(90deg);}
    .entry-label {white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
    .row-more {opacity:0; width:26px; height:26px; flex:0 0 26px; border:0; color:var(--muted); background:transparent; border-radius:6px; margin-right:3px; font-size:19px; line-height:1;}
    .tree-row:hover .row-more,.tree-row.selected .row-more,.row-more:focus-visible {opacity:1;}
    .row-more:hover {background:var(--surface); color:var(--ink);}
    .folder-drop {outline:1px dashed var(--accent); outline-offset:-1px; background:var(--selected)!important;}
    .workspace-trigger.root-drop,.tree.root-drop {outline:2px dashed var(--accent); outline-offset:-3px; background:var(--selected); border-radius:8px;}
    .workspace-trigger.root-drop .workspace-label::after {content:' · в корень'; font-size:11px; color:var(--accent); font-weight:550;}
    .tree-empty {color:var(--muted); font-size:11.5px; padding:9px 15px;}
    .aside-foot {height:var(--footer-height); flex:0 0 var(--footer-height); border-top:1px solid var(--line); padding:0 14px; display:flex; align-items:center;}
    .explorer-actions {display:flex; align-items:center; gap:8px; width:100%;}
    .toolbar-spacer {flex:1; min-width:0;}
    .sort-menu {position:fixed; z-index:75; width:235px; padding:7px; border:1px solid var(--line); border-radius:11px; background:var(--surface); box-shadow:0 18px 50px rgba(0,0,0,.15);}
    .sort-menu[hidden] {display:none;}
    .sort-menu .menu-heading {display:block; padding:7px 10px 9px; color:var(--muted); font-size:11px; font-weight:600;}
    .sort-menu label {display:flex; align-items:center; gap:10px; cursor:pointer; border-radius:8px; padding:10px; font-size:12px;}
    .sort-menu label:hover {background:var(--hover);}
    .sort-menu input {margin:0; accent-color:var(--accent);}
    .explorer-actions .icon-btn {height:30px; width:31px; flex-basis:31px;}
    .editor-pane {flex:1; display:flex; flex-direction:column; min-width:0; min-height:0;}
    .editor-head {height:68px; flex:0 0 68px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr minmax(140px, 2fr) 1fr; align-items:center; gap:12px; padding:0 20px;}
    .editor-left,.editor-right {display:flex; align-items:center; gap:4px; min-width:0;}
    .editor-right {justify-content:flex-end;}
    .editor-left .icon-btn {width:32px; flex-basis:32px;}
    .theme-fallback {display:none!important;}
    .shell.sidebar-hidden .theme-fallback {display:grid!important;}
    .sidebar-toggle {display:none;}
    .shell.sidebar-hidden .sidebar-toggle {display:grid;}
    .document-title {min-width:0; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--ink); padding:8px 9px; width:100%; text-align:center; font-size:14px; font-weight:650; text-overflow:ellipsis;}
    .document-title:hover {background:var(--hover);}
    .document-title:focus {background:var(--surface); border-color:var(--line); outline:2px solid var(--accent); outline-offset:0;}
    .appearance {position:static; display:flex; align-items:center;}
    .appearance-toggle {width:33px; flex-basis:33px; height:33px;}
    .theme-menu {position:fixed; z-index:75; min-width:190px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:7px; box-shadow:0 18px 50px rgba(0,0,0,.15);}
    .theme-menu[hidden] {display:none;}
    .theme-heading {display:block; padding:7px 10px 9px; color:var(--muted); font-size:11px; font-weight:600;}
    .theme-menu label {display:flex; align-items:center; gap:10px; padding:10px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;}
    .theme-menu label:hover {background:var(--hover);}
    .theme-menu input {margin:0; accent-color:var(--accent);}
    .save-btn {height:33px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-contrast); padding:0 13px; border-radius:8px; font-size:11.5px; font-weight:650; white-space:nowrap;}
    .save-btn:hover {filter:brightness(.95);}
    .editor-wrap {flex:1 1 auto; min-height:0; min-width:0; display:flex; position:relative; overflow:hidden;}
    #editor {width:100%; height:100%; min-width:0; min-height:0; flex:1 1 auto; border:0; outline:0; resize:none; background:transparent; color:var(--ink); font:14px/1.9 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; padding:34px clamp(20px,5vw,72px); tab-size:2; white-space:pre-wrap; overflow-wrap:anywhere; overflow-x:hidden; overflow-y:auto;}
    #editor::placeholder {color:var(--muted); opacity:.75;}
    #editor:focus-visible {outline:none;}
    .editor-foot {height:var(--footer-height); flex:0 0 var(--footer-height); border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 22px; color:var(--muted); font-size:11.5px;}
    .editor-meta {display:flex; align-items:center; gap:16px; white-space:nowrap;}
    .save-indicator {display:flex; align-items:center; gap:7px; white-space:nowrap;}
    .save-indicator::before {content:''; width:6px; height:6px; border-radius:50%; background:#8cb397;}
    .save-indicator.dirty {color:var(--warning);}
    .save-indicator.dirty::before {background:var(--warning);}
    #message {overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1;}
    #message.error {color:var(--error);}
    #message.success {color:var(--accent);}
    .context-menu {position:fixed; z-index:60; width:192px; padding:5px; border:1px solid var(--line); border-radius:11px; background:var(--surface); box-shadow:0 16px 46px rgba(0,0,0,.15);}
    .context-menu[hidden],.context-menu button[hidden] {display:none;}
    .context-menu button {display:block; width:100%; border:0; background:transparent; border-radius:7px; color:var(--ink); text-align:left; padding:10px 11px; font-size:12px;}
    .context-menu button:hover {background:var(--hover);}
    .context-menu button.danger {color:var(--error);}
    .context-menu hr {border:0; border-top:1px solid var(--line); margin:5px 3px;}
    .scrim {display:none;}
    .drop-overlay {position:absolute; inset:10px; z-index:90; border:2px dashed var(--accent); border-radius:13px; background:var(--surface); opacity:.96; display:none; place-items:center; text-align:center; color:var(--ink); pointer-events:none;}
    .drop-overlay.visible {display:grid;}
    .drop-overlay svg {width:38px; height:38px; display:block; margin:auto auto 14px; color:var(--accent);}
    .drop-overlay strong {display:block; font-size:16px; margin-bottom:5px;}
    .drop-overlay small {color:var(--muted);}
    dialog {border:1px solid var(--line); border-radius:15px; width:min(420px,calc(100% - 24px)); background:var(--surface); color:var(--ink); box-shadow:0 20px 70px rgba(0,0,0,.20); padding:24px;}
    dialog::backdrop {background:rgba(11,22,15,.42);}
    dialog h2 {margin:0 0 9px; font-size:17px;}
    dialog p {margin:0 0 18px; color:var(--muted); font-size:12px; line-height:1.6; overflow-wrap:anywhere;}
    dialog select {width:100%; min-height:41px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:8px;}
    .dialog-actions {display:flex; justify-content:flex-end; gap:8px; margin-top:22px;}
    .dialog-actions button {border:1px solid var(--line); padding:9px 15px; border-radius:8px; background:var(--surface); color:var(--ink);}
    .dialog-actions .confirm {background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
    @media (max-width:1000px) {
      .editor-head {padding:0 11px; gap:3px;}
      .editor-head .icon-btn {width:29px; flex-basis:29px;}
      .editor-foot {padding:0 13px; gap:8px;}
      .editor-meta {gap:9px;}
    }
    @media (max-width:760px) {
      .sidebar-resizer {display:none;}
      .theme-fallback,.shell.sidebar-hidden .theme-fallback {display:none!important;}
      .sidebar,.shell.sidebar-hidden .sidebar {position:absolute; z-index:45; left:0; top:0; bottom:0; height:100%; width:min(325px,87vw); flex-basis:auto; display:flex; border-right:1px solid var(--line); transform:translateX(-105%); transition:transform .22s ease; overflow:hidden; box-shadow:var(--shadow);}
      .shell.mobile-sidebar-open .sidebar {transform:translateX(0);}
      .scrim {position:absolute; inset:0; background:rgba(8,18,10,.32); z-index:40; display:none;}
      .shell.mobile-sidebar-open .scrim {display:block;}
      .sidebar-toggle,.shell.sidebar-hidden .sidebar-toggle {display:grid;}
      .editor-head {height:60px; flex-basis:60px; grid-template-columns:1fr minmax(115px,1.4fr) 1fr; padding:0 9px;}
      .document-title {font-size:12.5px; padding:7px 3px;}
      .save-btn {padding:0 8px;}
      .editor-foot {font-size:10px;}
      .editor-meta {gap:8px;}
      #editor {font-size:13.5px; padding:22px 18px;}
    }
    @media (max-width:410px) {
      .editor-head {grid-template-columns:1fr minmax(84px,1.15fr) 1fr;}
      .editor-left,.editor-right {gap:0;}
      .editor-foot #wordCount {display:none;}
      .save-indicator {font-size:0;}
      .save-indicator::before {width:8px; height:8px;}
    }
    @media (prefers-reduced-motion:reduce) {*,*:before,*:after {transition:none!important;}}
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Проводник рабочей директории">
      <header class="aside-head">
        <button class="workspace-trigger" id="workspaceBtn" title="Выбрать рабочую директорию" type="button">
          <span class="workspace-label" id="workspaceLabel">Рабочий каталог</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
          <div class="appearance">
            <button class="icon-btn appearance-toggle" id="themeBtn" type="button" title="Оформление" aria-label="Оформление" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg>
            </button>

          </div>
        <button class="icon-btn" id="collapseBtn" title="Скрыть проводник" aria-label="Скрыть проводник" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </header>
      <div class="tree" id="tree" aria-label="Содержимое рабочей директории">
        <div class="empty-workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v9H3V8Z"/><path d="M3 12h18"/></svg><strong>Рабочая директория</strong>Выберите папку или перетащите её сюда, чтобы работать с файлами.<br><button class="text-button" type="button" id="inlineChooseBtn">Выбрать папку</button></div>
      </div>
      <footer class="aside-foot">
        <div class="explorer-actions">
          <button class="icon-btn" id="expandAllBtn" type="button" title="Раскрыть все папки" aria-label="Раскрыть все папки" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 4 4 4-4M8 15l4 4 4-4"/><path d="M5 12h14"/></svg>
          </button>
          <button class="icon-btn" id="collapseAllBtn" type="button" title="Свернуть все папки" aria-label="Свернуть все папки" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/><path d="M5 12h14"/></svg>
          </button>
          <span class="toolbar-spacer" aria-hidden="true"></span>
          <button class="icon-btn" id="sortBtn" type="button" title="Сортировать файлы и папки" aria-label="Сортировать файлы и папки" aria-haspopup="true" aria-expanded="false" aria-controls="sortMenu" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11M4 12h8M4 17h5"/><path d="m16 14 3 3 3-3M19 17V5"/></svg>
          </button>
          <button class="icon-btn" id="refreshBtn" title="Обновить список файлов" aria-label="Обновить список файлов" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 4v7h-7"/></svg>
          </button>
        </div>
      </footer>
    </aside>
    <div class="sort-menu" id="sortMenu" role="group" aria-label="Сортировка проводника" hidden>
      <span class="menu-heading">Сортировать</span>
      <label><input type="radio" name="sort-order" value="folders-asc"> Папки сначала · А–Я</label>
      <label><input type="radio" name="sort-order" value="folders-desc"> Папки сначала · Я–А</label>
      <label><input type="radio" name="sort-order" value="name-asc"> По имени · А–Я</label>
      <label><input type="radio" name="sort-order" value="name-desc"> По имени · Я–А</label>
    </div>
    <div class="sidebar-resizer" id="sidebarResizer" role="separator" tabindex="0" aria-label="Изменить ширину проводника" aria-orientation="vertical" aria-controls="sidebar" aria-valuemin="220" aria-valuemax="620" aria-valuenow="315" title="Перетащите для изменения ширины; стрелки — с клавиатуры"></div>
    <div class="scrim" id="scrim" aria-hidden="true"></div>
      <div class="theme-menu" id="themeMenu" role="group" aria-label="Выбор темы" hidden>
              <span class="theme-heading">Оформление</span>
              <label><input type="radio" name="theme" value="system"> Системная</label>
              <label><input type="radio" name="theme" value="light"> Светлая</label>
              <label><input type="radio" name="theme" value="dark"> Тёмная</label>
            </div>
    <section class="editor-pane" aria-label="Редактор текста">
      <header class="editor-head">
        <div class="editor-left">
          <button class="icon-btn sidebar-toggle" id="expandBtn" aria-label="Показать проводник" title="Показать проводник" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
          <button class="icon-btn theme-fallback" id="themeFallbackBtn" type="button" title="Оформление" aria-label="Оформление" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg></button>
          <button class="icon-btn" id="undoBtn" type="button" aria-label="Отменить" title="Отменить (Ctrl/⌘+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
          <button class="icon-btn" id="redoBtn" type="button" aria-label="Повторить" title="Повторить (Ctrl/⌘+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg></button>
        </div>
        <input id="documentName" class="document-title" value="Без названия.txt" aria-label="Название документа (можно изменить)" title="Нажмите, чтобы переименовать документ" spellcheck="false" maxlength="200">
        <div class="editor-right">
          <button class="save-btn" id="saveBtn" type="button" title="Сохранить (Ctrl/⌘+S)">Сохранить</button>
        </div>
      </header>
      <div class="editor-wrap"><textarea id="editor" wrap="soft" aria-label="Текст документа" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="Начните печатать или откройте текстовый файл…"></textarea></div>
      <footer class="editor-foot"><span id="message" role="status" aria-live="polite">Файлы остаются на вашем компьютере</span><div class="editor-meta"><span id="lineCount">1 стр.</span><span id="wordCount">0 слов</span><span id="charCount">0 симв.</span><span class="save-indicator" id="saveState">Сохранено</span></div></footer>
    </section>
    <nav class="context-menu" id="contextMenu" aria-label="Действия с объектом" hidden>
      <button type="button" data-action="new-file">Новый файл</button><button type="button" data-action="new-folder">Новая папка</button><hr>

  <script>
    'use strict';

    function setSidebar(open){

    const sidebarResizer=$('sidebarResizer'), sidebar=$('sidebar');

    const themeBtn=$('themeBtn'), themeMenu=$('themeMenu');
    let themeChoice='system';
    function getTheme(){try{const p=localStorage.getItem('list-theme');return ['system','light','dark'].includes(p)?p:'system';}catch{return 'system';}}

    const themeFallbackBtn=$('themeFallbackBtn');

    function closeThemeMenu(){

    }
    function toggleThemeMenu(trigger){

    themeMenu.addEventListener('change',event=>{if(event.target.matches('input[name="theme"]')){setTheme(event.target.value);closeThemeMenu();currentThemeTrigger.focus();}});
    themeMedia.addEventListener('change',()=>{if(themeChoice==='system')applyTheme('system');});
    function resetDocument(){
      currentHandle=null;activePath=null;filename='Без названия.txt';savedText='';eol='\n';knownVersion=null;
      editor.value='';update();syncSelection();
    }
    function newDocument(){if(busy||!maybeDiscard())return;resetDocument();editor.focus();notice('Создан новый документ. Сохраните его на диск.');}
    async function readDocument(handle,path=null,skipWarnings=false){
      const file=await handle.getFile();
      if(!skipWarnings&&file.size>10*1024*1024&&!confirm('Файл больше 10 МБ, редактор может замедлиться. Продолжить?'))return false;
      const raw=await file.text();
      if(!skipWarnings&&raw.includes('\0')&&!confirm('Похоже, это двоичный файл. Открыть его как текст?'))return false;
      currentHandle=handle; activePath=path; filename=handle.name; eol=raw.includes('\r\n')?'\r\n':'\n';
      editor.value=raw; savedText=editor.value; knownVersion={size:file.size,lastModified:file.lastModified};
      if(path!==null){selectedPath=path;selectedKind='file';}
      else{selectedPath=null;selectedKind=null;}
      update();syncSelection();return true;
    }
    async function openFile(handle,path=null){
      if(busy||!maybeDiscard())return;
      setBusy(true);
      try{if(await readDocument(handle,path)){editor.focus();notice('Файл открыт. Изменения можно сохранить на диск.','success');if(media.matches)setSidebar(false);}}
      catch(error){showError(error);}finally{setBusy(false);}
    }
    async function openPicker(){
      if(busy||!maybeDiscard()||!requireApi(['showOpenFilePicker']))return;
      try{const pending=window.showOpenFilePicker({id:'list-open',multiple:false});const [handle]=await pending;await openFile(handle);}
      catch(error){showError(error);}
    }
    async function save(saveAs=false){
      if(busy||!requireApi(['showSaveFilePicker']))return;
      let target=currentHandle, created=false;
      if(saveAs||!target){
        try{const pending=window.showSaveFilePicker({id:'list-save',suggestedName:filename,
          types:[{description:'Текстовые файлы',accept:{'text/plain':['.txt','.md','.csv','.log','.json','.xml','.yaml','.yml']}}],
          ...(root?{startIn:root}:{})});target=await pending;created=true;}
        catch(error){showError(error);return;}
      }
      setBusy(true);const snapshot=editor.value;
      try{
        if(!created&&knownVersion){const disk=await target.getFile();

            if(!confirm('Файл изменён другой программой. Перезаписать его?'))return;
          }
        }
        const stream=await target.createWritable();
        try{await stream.write(snapshot.replace(/\n/g,eol));await stream.close();}
        catch(error){try{await stream.abort();}catch{}throw error;}
        currentHandle=target;filename=target.name;savedText=snapshot;
        const disk=await target.getFile();knownVersion={size:disk.size,lastModified:disk.lastModified};
        if(created){activePath=null;
          if(root?.resolve){try{const path=await root.resolve(target);if(path)activePath=path.join('/');}catch{}}
          selectedPath=activePath;selectedKind=activePath?'file':null;
        }
        update();syncSelection();if(root)await refreshTree();
        notice(dirty()?'Сохранено; появились новые изменения.':'Файл сохранён на диске.','success');
      }catch(error){showError(error);}finally{setBusy(false);}
    }
    async function directoryAt(path=''){
      if(!root)throw new Error('Рабочая папка не выбрана');
      let dir=root;
      for(const name of path.split('/').filter(Boolean))dir=await dir.getDirectoryHandle(name);
      return dir;
    }
    async function entryAt(path){
      if(!path)throw new Error('Нельзя изменить корень рабочей папки');
      const parent=await directoryAt(parentPath(path));const name=basename(path);
      try{return {parent,name,handle:await parent.getFileHandle(name),kind:'file'};}
      catch(error){if(!['TypeMismatchError','NotFoundError'].includes(error.name))throw error;}
      return {parent,name,handle:await parent.getDirectoryHandle(name),kind:'directory'};
    }
    async function entryExists(parent,name){
      for(const method of ['getFileHandle','getDirectoryHandle']){
        try{await parent[method](name);return true;}
        catch(error){if(!['NotFoundError','TypeMismatchError'].includes(error.name))throw error;}
      }return false;
    }
    async function ensureWritable(){
      if(!root)return false;
      if(typeof root.queryPermission==='function'){
        const p=await root.queryPermission({mode:'readwrite'});if(p==='granted')return true;
        if(typeof root.requestPermission==='function')return(await root.requestPermission({mode:'readwrite'}))==='granted';
        throw new DOMException('Нет доступа на запись','NotAllowedError');
      }return true;
    }
    async function reloadWorkspace(){
      if(!root)return;
      const version=++treeVersion;tree.replaceChildren();
      try{await renderEntries(root,tree,'',0,version);if(treeVersion===version&&!tree.children.length){const hint=document.createElement('div');hint.className='tree-empty';hint.textContent='Папка пуста';tree.append(hint);}}
      catch(error){showError(error);}syncSelection();
    }
    async function refreshTree(){await reloadWorkspace();}
    const SORT_OPTIONS = ['folders-asc','folders-desc','name-asc','name-desc'];
    function readSortOrder(){
      try{const preference=localStorage.getItem('list-sort-order');return SORT_OPTIONS.includes(preference)?preference:'folders-asc';}
      catch{return 'folders-asc';}
    }
    let sortOrder=readSortOrder();
    function compareEntries(a,b){
      if(sortOrder.startsWith('folders-')&&a.kind!==b.kind)return a.kind==='directory'?-1:1;
      const comparison=a.name.localeCompare(b.name,'ru',{numeric:true});
      return sortOrder.endsWith('-desc')?-comparison:comparison;
    }
    const sortBtn=$('sortBtn'),sortMenu=$('sortMenu');
    function closeSortMenu(){sortMenu.hidden=true;sortBtn.setAttribute('aria-expanded','false');}
    sortBtn.addEventListener('click',()=>{
      if(!root||busy)return;
      const opening=sortMenu.hidden;
      closeThemeMenu();closeMenu();
      if(!opening){closeSortMenu();return;}
      for(const input of sortMenu.querySelectorAll('input[name="sort-order"]'))input.checked=input.value===sortOrder;
      sortMenu.hidden=false;sortBtn.setAttribute('aria-expanded','true');
      const rect=sortBtn.getBoundingClientRect(), w=sortMenu.offsetWidth, h=sortMenu.offsetHeight;
      sortMenu.style.left=Math.max(8,Math.min(rect.right-w,window.innerWidth-w-8))+'px';
      sortMenu.style.top=Math.max(8,rect.top-h-8)+'px';
    });
    sortMenu.addEventListener('change',async event=>{
      const choice=event.target;
      if(!choice.matches('input[name="sort-order"]')||!SORT_OPTIONS.includes(choice.value))return;
      sortOrder=choice.value;
      try{localStorage.setItem('list-sort-order',sortOrder);}catch{}
      closeSortMenu();sortBtn.focus();
      try{await refreshTree();}catch(error){showError(error);}
    });
    const EXPAND_LIMIT=1000, EXPAND_DEPTH_LIMIT=20;
    async function expandAllFolders(){
      if(!root||busy)return;
      closeSortMenu();setBusy(true);
      const paths=[], stack=[{dir:root,path:'',depth:0}];
      let incomplete=false;
      try{
        while(stack.length){
          const current=stack.pop();
          const directories=[];
          for await(const item of current.dir.values()){
            if(item.kind!=='directory'||item.name.startsWith('.'))continue;
            const path=pathJoin(current.path,item.name);
            if(paths.length>=EXPAND_LIMIT){incomplete=true;break;}
            paths.push(path);
            if(current.depth+1<EXPAND_DEPTH_LIMIT)directories.push({dir:item,path,depth:current.depth+1});
            else incomplete=true;
          }
          if(incomplete&&paths.length>=EXPAND_LIMIT)break;
          stack.push(...directories.reverse());
        }
        expanded.clear();for(const path of paths)expanded.add(path);
        await refreshTree();
        notice(incomplete?'Раскрыты первые '+paths.length+' папок. Для больших деревьев действует ограничение на глубину и количество.':'Раскрыты все папки.','success');
      }catch(error){showError(error);}finally{setBusy(false);}
    }
    async function collapseAllFolders(){
      if(!root||busy)return;
      closeSortMenu();setBusy(true);
      try{expanded.clear();await refreshTree();tree.scrollTop=0;notice('Все папки свёрнуты.','success');}
      catch(error){showError(error);}finally{setBusy(false);}
    }
    $('expandAllBtn').addEventListener('click',expandAllFolders);
    $('collapseAllBtn').addEventListener('click',collapseAllFolders);
    function svgIcon(kind){
      const d={folder:'M3 8a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9H3V8Z',file:'M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z',chevron:'m9 6 6 6-6 6'};
      const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.7');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');
      const path=document.createElementNS(svgNS,'path');path.setAttribute('d',d[kind]);svg.append(path);return svg;
    }
    async function renderEntries(dir,parent,path,depth,version){
      // The File System Access API does not expose OS-specific hidden attributes.
      // For cross-platform consistency, dot-prefixed entries are not shown.
      const items=[];for await(const item of dir.values())if(!item.name.startsWith('.'))items.push(item);
      if(version!==treeVersion)return;
      items.sort(compareEntries);
      for(const item of items){
        const p=pathJoin(path,item.name), isFolder=item.kind==='directory';
        const row=document.createElement('div');row.className='tree-row';row.dataset.path=p;row.dataset.kind=item.kind;
        row.style.paddingLeft=(depth*15)+'px';
        const b=document.createElement('button');b.type='button';b.className='tree-entry';b.title=p;
        if(isFolder){b.setAttribute('aria-expanded',String(expanded.has(p)));b.append(svgIcon('chevron'));}
        else{const gap=document.createElement('span');gap.style.cssText='width:12px;flex:0 0 12px';b.append(gap);}
        b.append(svgIcon(isFolder?'folder':'file'));
        const label=document.createElement('span');label.className='entry-label';label.textContent=item.name;b.append(label);
        const more=document.createElement('button');more.className='row-more';more.type='button';more.textContent='⋯';more.title='Действия с '+item.name;more.setAttribute('aria-label','Действия с '+item.name);
        row.append(b,more);parent.append(row);
        const children=document.createElement('div');children.hidden=!expanded.has(p);if(isFolder)parent.append(children);
        const toggle=async()=>{
          if(!isFolder)return openFile(item,p);

          if(open)expanded.add(p);else expanded.delete(p);
          children.hidden=!open;b.setAttribute('aria-expanded',String(open));
          if(open){children.replaceChildren();try{await renderEntries(item,children,p,depth+1,version);if(!children.children.length){const n=document.createElement('div');n.className='tree-empty';n.textContent='Папка пуста';children.append(n);}}catch(error){showError(error);}}
        };
        b.addEventListener('click',toggle);
        more.addEventListener('click',e=>{e.stopPropagation();chooseSelection(p,item.kind);openMenu(e.clientX,e.clientY);});
        row.addEventListener('contextmenu',e=>{e.preventDefault();chooseSelection(p,item.kind);openMenu(e.clientX,e.clientY);});
        row.draggable=true;
        row.addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('application/x-list-path',p);e.dataTransfer.effectAllowed='move';});
        if(isFolder){
          row.addEventListener('dragover',e=>{if(Array.from(e.dataTransfer.types).includes('application/x-list-path')){e.preventDefault();e.stopPropagation();row.classList.add('folder-drop');}});
          row.addEventListener('dragleave',()=>row.classList.remove('folder-drop'));

        }

    }
    async function activateWorkspace(directory){
      if(directory.kind!=='directory')throw new Error('Выберите директорию, а не файл');
      if(busy)return;
      setBusy(true);
      try{root=directory;selectedPath=null;selectedKind=null;
        expanded.clear();treeVersion++;$('workspaceLabel').textContent=directory.name;
        $('workspaceBtn').title=directory.name+' · сменить рабочую директорию';
        // Previously opened document stays visible, but its path no longer refers to this workspace.
        activePath=null;

      }catch(error){showError(error);}finally{setBusy(false);}
    }
    async function chooseWorkspace(){
      if(busy||!requireApi(['showDirectoryPicker']))return;
      try{const pending=window.showDirectoryPicker({id:'list-workspace',mode:'readwrite'});await activateWorkspace(await pending);}
      catch(error){showError(error);}
    }
    async function createFile(){
      if(busy||!root||!maybeDiscard())return;

      const name=prompt('Название файла:', 'Новый документ.txt');if(name===null)return;
      const value=name.trim();if(!validName(value))return notice('Недопустимое имя файла.','error');

        editor.value='';savedText='';filename=value;knownVersion=null;eol='\n';
        if(destPath)expanded.add(destPath);
        await refreshTree();update();editor.focus();notice('Создан файл «'+value+'».','success');
      }catch(error){showError(error);}finally{setBusy(false);}
    }
    async function createFolder(){
      if(busy||!root)return;
      const destPath=selectedKind==='directory'?selectedPath:(selectedPath?parentPath(selectedPath):'');
      const name=prompt('Название новой папки:', 'Новая папка');if(name===null)return;
      const value=name.trim();if(!validName(value))return notice('Недопустимое имя папки.','error');
      setBusy(true);
      try{if(!(await ensureWritable()))return notice('Доступ на запись не предоставлен.','error');
        const dir=await directoryAt(destPath);if(await entryExists(dir,value))return notice('Объект с таким именем уже существует.','error');
        await dir.getDirectoryHandle(value,{create:true});if(destPath)expanded.add(destPath);
        selectedPath=pathJoin(destPath,value);selectedKind='directory';
        await refreshTree();notice('Создана папка «'+value+'».','success');
      }catch(error){showError(error);}finally{setBusy(false);}
    }
    async function copyEntry(entry,destParent,name){
      let created=false;
      try{
        if(entry.kind==='file'){
          const data=await entry.handle.getFile();const dest=await destParent.getFileHandle(name,{create:true});created=true;
          const writable=await dest.createWritable();
          try{await writable.write(data);await writable.close();}catch(error){try{await writable.abort();}catch{}throw error;}
          const verified=await dest.getFile();if(verified.size!==data.size)throw new Error('Копирование не завершилось: размер файла отличается');
          return dest;
        }
        const dest=await destParent.getDirectoryHandle(name,{create:true});created=true;
        for await(const item of entry.handle.values())await copyEntry({kind:item.kind,handle:item},dest,item.name);
        return dest;
      }catch(error){
        if(created)try{await destParent.removeEntry(name,{recursive:true});}catch(cleanError){console.error('Не удалось очистить неполную копию',cleanError);notice('Осталась частичная копия «'+name+'». Проверьте папку назначения.','error');}
        throw error;
      }
    }
    async function moveEntry(src,destination,newName=basename(src)){
      if(!root||!src||busy)return false;
      if(!validName(newName))return notice('Недопустимое имя.','error'),false;
      if(destPathEquals(src,destination,newName))return true;
      const sourceAffected=activePath&&isInside(activePath,src);
      if(sourceAffected&&dirty())return notice('Сначала сохраните открытый документ перед перемещением или переименованием.','error'),false;
      if(selectedKind==='directory'&&(destination===src||destination.startsWith(src+'/')))
        return notice('Нельзя переместить папку внутрь самой себя.','error'),false;
      setBusy(true);
      try{
        if(!(await ensureWritable()))return notice('Доступ на запись не предоставлен.','error'),false;
        const entry=await entryAt(src), destParent=await directoryAt(destination);
        if(entry.kind==='directory'&&(destination===src||destination.startsWith(src+'/')))
          return notice('Нельзя переместить папку внутрь самой себя.','error'),false;
        if(await entryExists(destParent,newName))return notice('В папке назначения уже есть «'+newName+'».','error'),false;
        const dest=pathJoin(destination,newName);
        const newHandle=await copyEntry(entry,destParent,newName);
        // Source is removed only after the copy has completed and was verified.
        try{await entry.parent.removeEntry(entry.name,{recursive:entry.kind==='directory'});}
        catch(error){throw new Error('Копия создана, но исходник не удалён. Оба объекта сохранены. Причина: '+(error?.message||error));}
        const relocated=path=>path===src?dest+path.slice(src.length):path.startsWith(src+'/')?dest+path.slice(src.length):path;
        if(activePath&&isInside(activePath,src)){
          activePath=relocated(activePath);
          const h=entry.kind==='file'?newHandle:(await entryAt(activePath)).handle;
          await readDocument(h,activePath,true);
        }
        selectedPath=dest;selectedKind=entry.kind;
        const before=[...expanded];expanded.clear();for(const path of before)expanded.add(relocated(path));
        if(destination)expanded.add(destination);
        await refreshTree();notice('Перемещено: '+src+' → '+dest,'success');return true;
      }catch(error){showError(error);return false;}finally{setBusy(false);}
    }
    function destPathEquals(src,dest,name){return src===pathJoin(dest,name);}
    async function renameSelected(){
      if(busy||!selectedPath)return;
      const src=selectedPath;const proposed=prompt('Новое название:',basename(src));if(proposed===null)return;
      const newName=proposed.trim();
      await moveEntry(src,parentPath(src),newName);
    }
    async function deleteSelected(){
      if(busy||!root||!selectedPath)return;
      const src=selectedPath;
      if(activePath&&isInside(activePath,src)&&dirty())return notice('Сначала сохраните документ перед удалением.','error');
      const kind=selectedKind;
      if(!confirm('Удалить '+(kind==='directory'?'папку со всем содержимым':'файл')+' «'+src+'»?\n\nОперация необратима: корзина не используется.'))return;
      setBusy(true);
      try{
        if(!(await ensureWritable()))return notice('Доступ на запись не предоставлен.','error');
        const entry=await entryAt(src);await entry.parent.removeEntry(entry.name,{recursive:entry.kind==='directory'});
        if(activePath&&isInside(activePath,src))resetDocument();
        for(const p of [...expanded])if(isInside(p,src))expanded.delete(p);
        selectedPath=null;selectedKind=null;
        await refreshTree();notice('Удалено: '+src,'success');
      }catch(error){showError(error);}finally{setBusy(false);}
    }
    async function folderOptions(source){
      const out=[{path:'',name:root.name}];let count=0;
      async function walk(dir,path,depth){
        if(depth>12||count>650)return;
        for await(const item of dir.values())if(item.kind==='directory'&&!item.name.startsWith('.')){
          const p=pathJoin(path,item.name);if(isInside(p,source))continue;
          out.push({path:p,name:'　'.repeat(depth+1)+'↳ '+item.name});count++;
          await walk(item,p,depth+1);
        }
      }await walk(root,'',0);return out;
    }
    async function askDestination(source){
      const dialog=$('moveDialog'), select=$('destinationSelect');
      $('moveDescription').textContent='Объект: '+source;
      select.replaceChildren();
      const candidates=await folderOptions(source);
      for(const item of candidates){const option=document.createElement('option');option.value=item.path;option.textContent=item.name;select.append(option);}
      if(!candidates.length)return null;
      const oldParent=parentPath(source);
      select.value=candidates.some(x=>x.path===oldParent)?oldParent:'';
      dialog.showModal();
      return new Promise(resolve=>{
        const cancel=()=>finish(null),done=()=>finish(select.value);
        const onClose=()=>finish(null);
        function finish(value){$('moveCancel').removeEventListener('click',cancel);$('moveConfirm').removeEventListener('click',done);dialog.removeEventListener('close',onClose);if(dialog.open)dialog.close();resolve(value);}
        $('moveCancel').addEventListener('click',cancel);$('moveConfirm').addEventListener('click',done);dialog.addEventListener('close',onClose);
      });
    }
    async function moveSelected(){
      if(busy||!selectedPath)return;
      const source=selectedPath;
      try{const target=await askDestination(source);if(target===null)return;
        if(destPathEquals(source,target,basename(source)))return notice('Файл уже находится в выбранной папке.');
        await moveEntry(source,target);
      }catch(error){showError(error);}
    }
    async function commitTitle(){
      if(dismissTitleChange){dismissTitleChange=false;titleEditing=false;titleInput.value=filename;return;}
      titleEditing=false;const target=titleInput.value.trim();
      if(target===filename)return;
      if(!validName(target)){titleInput.value=filename;return notice('Недопустимое имя документа.','error');}
      if(busy){titleInput.value=filename;return;}
      if(!currentHandle){filename=target;update();return notice('Имя задано. Сохраните документ, чтобы создать файл.');}
      if(!root||activePath===null){titleInput.value=filename;return notice('Для переименования откройте файл через рабочую папку.','error');}
      if(dirty()){titleInput.value=filename;return notice('Сначала сохраните изменения перед переименованием.','error');}
      const ok=await moveEntry(activePath,parentPath(activePath),target);
      if(!ok)titleInput.value=filename;
    }
    titleInput.addEventListener('focus',()=>{titleEditing=true;titleInput.select();});
    titleInput.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();titleInput.blur();}
      else if(e.key==='Escape'){dismissTitleChange=true;titleInput.blur();}
    });
    titleInput.addEventListener('blur',commitTitle);
    const menu=$('contextMenu');
    function closeMenu(){menu.hidden=true;}
    function openMenu(x,y,{rootMenu=false}={}){
      if(!root||(!rootMenu&&!selectedPath))return;
      for(const action of ['rename','move','delete'])menu.querySelector('[data-action="'+action+'"]').hidden=rootMenu;
      $('moveToRootAction').hidden=rootMenu||!parentPath(selectedPath);
      menu.hidden=false;
      const w=menu.offsetWidth,h=menu.offsetHeight;
      menu.style.left=Math.max(8,Math.min(x,window.innerWidth-w-8))+'px';
      menu.style.top=Math.max(8,Math.min(y,window.innerHeight-h-8))+'px';
    }
    menu.addEventListener('click',e=>{
      const action=e.target.closest('button')?.dataset.action;if(!action)return;closeMenu();
      ({'new-file':createFile,'new-folder':createFolder,rename:renameSelected,move:moveSelected,'move-root':()=>moveEntry(selectedPath,''),delete:deleteSelected})[action]();
    });
    document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!e.target.closest('.row-more'))closeMenu();if(!themeMenu.contains(e.target)&&!themeBtn.contains(e.target)&&!themeFallbackBtn.contains(e.target))closeThemeMenu();if(!sortMenu.contains(e.target)&&!sortBtn.contains(e.target))closeSortMenu();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeThemeMenu();closeSortMenu();if(media.matches)setSidebar(false);}});
    // The blank area and workspace header represent the root context.
    function openRootContextMenu(event){
      if(!root||busy)return;
      if(event.currentTarget===tree&&event.target.closest('.tree-row'))return;
      if(event.target.closest('.text-button'))return;
      event.preventDefault();
      chooseSelection(null,null);
      openMenu(event.clientX,event.clientY,{rootMenu:true});
    }
    tree.addEventListener('contextmenu',openRootContextMenu);
    $('workspaceBtn').addEventListener('contextmenu',openRootContextMenu);
    const rootTargets=[$('workspaceBtn'),tree];
    function hasTreeDrag(event){return Array.from(event.dataTransfer?.types||[]).includes('application/x-list-path');}
    function rootTargetAllowed(event,target){
      return Boolean(root&&hasTreeDrag(event)&&(target!==tree||!event.target.closest('.tree-row')));
    }
    for(const target of rootTargets){
      target.addEventListener('dragover',event=>{
        if(!rootTargetAllowed(event,target))return;
        event.preventDefault();event.stopPropagation();event.dataTransfer.dropEffect='move';target.classList.add('root-drop');
      });
      target.addEventListener('dragleave',event=>{
        if(!target.contains(event.relatedTarget))target.classList.remove('root-drop');
      });
      target.addEventListener('drop',event=>{
        if(!rootTargetAllowed(event,target))return;
        const source=event.dataTransfer.getData('application/x-list-path');if(!source)return;
        event.preventDefault();event.stopPropagation();
        target.classList.remove('root-drop');moveEntry(source,'');
      });
    }
    document.addEventListener('dragend',()=>rootTargets.forEach(target=>target.classList.remove('root-drop')));
    $('workspaceBtn').addEventListener('click',chooseWorkspace);
    $('inlineChooseBtn').addEventListener('click',chooseWorkspace);
    $('refreshBtn').addEventListener('click',refreshTree);
    $('saveBtn').addEventListener('click',()=>save());
    $('undoBtn').addEventListener('click',()=>{editor.focus();document.execCommand('undo');update();});
    $('redoBtn').addEventListener('click',()=>{editor.focus();document.execCommand('redo');update();});
    editor.addEventListener('input',update);
    editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();editor.setRangeText('  ',editor.selectionStart,editor.selectionEnd,'end');update();}});
    document.addEventListener('keydown',e=>{
      const mod=e.ctrlKey||e.metaKey;if(!mod||e.altKey)return;
      const k=e.key.toLowerCase();
      if(k==='s'){e.preventDefault();save(e.shiftKey);}
      else if(k==='o'){e.preventDefault();openPicker();}
      else if(k==='n'){e.preventDefault();newDocument();}
    });
    window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
    // External directory drop; getAsFileSystemHandle must be called in the drop event, before awaiting anything.
    let externalDragCount=0;
    document.addEventListener('dragenter',e=>{
      if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;
      e.preventDefault();externalDragCount++;$('dropOverlay').classList.add('visible');
    });
    document.addEventListener('dragleave',e=>{
      if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;
      externalDragCount=Math.max(0,externalDragCount-1);if(!externalDragCount)$('dropOverlay').classList.remove('visible');
    });
    document.addEventListener('dragover',e=>{
      if(Array.from(e.dataTransfer?.types||[]).includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';}
    });
    document.addEventListener('drop',e=>{
      if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;
      e.preventDefault();externalDragCount=0;$('dropOverlay').classList.remove('visible');
      const items=Array.from(e.dataTransfer.items||[]).filter(x=>x.kind==='file');
      if(items.length!==1||typeof items[0].getAsFileSystemHandle!=='function'){
        notice('Перетащите одну папку. Если браузер не поддерживает загрузку перетаскиванием, выберите её кнопкой.','error');return;
      }
      const pending=items[0].getAsFileSystemHandle();
      Promise.resolve(pending).then(h=>{if(!h||h.kind!=='directory')throw new Error('Нужна папка, а не отдельный файл');return activateWorkspace(h);}).catch(showError);
    });
    update();setBusy(false);
    if(!('showDirectoryPicker' in window))notice('Для работы с папками откройте редактор в Chrome или Edge.','error');
  </script>
</body>
</html>
